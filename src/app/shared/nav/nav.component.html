<nav class="navbar">
  <a routerLink="/" class="nav-brand">
    <span class="nav-logo-circle">
      <img src="logo.png" alt="ЗОШ" class="nav-logo-img" />
    </span>
  </a>
  <div class="nav-links">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
      <tui-icon icon="@tui.bar-chart-2" class="nav-icon" />
      Прогресс
    </a>
    <a routerLink="/profile" routerLinkActive="active" class="nav-link">
      <tui-icon icon="@tui.user" class="nav-icon" />
      Профиль
    </a>
    <a *ngIf="isAdmin" routerLink="/admin" routerLinkActive="active" class="nav-link admin-link">
      <tui-icon icon="@tui.settings" class="nav-icon" />
      Админ
    </a>
    @if (navLoading) {
      <span class="nav-loader"><tui-loader size="xs" /></span>
    }
  </div>
  <button tuiButton appearance="outline" size="s" (click)="logout()" class="logout-btn">
    <tui-icon icon="@tui.log-out" />
    Выйти
  </button>
</nav>
