<nav class="navbar" [class.navbar--guest]="!loggedIn">
  <a routerLink="/" class="nav-brand" aria-label="ЗОШ, на главную">
    <span class="nav-logo-mark" aria-hidden="true">
      <img src="logo.png?v=4" alt="" class="nav-logo-img" width="18" height="18" />
    </span>
    <span class="nav-brand-text">ЗОШ</span>
  </a>

  @if (loggedIn) {
    <div class="nav-center">
      <div class="nav-links">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
          <tui-icon icon="@tui.bar-chart-2" class="nav-icon" />
          Прогресс
        </a>
        @if (isAdmin) {
          <a routerLink="/admin" routerLinkActive="active" class="nav-link admin-link">
            <tui-icon icon="@tui.settings" class="nav-icon" />
            Админ
          </a>
        }
        @if (navLoading) {
          <span class="nav-loader"><tui-loader size="xs" /></span>
        }
      </div>
    </div>
  } @else {
    <nav class="nav-landing" aria-label="Секции на главной">
      <a routerLink="/" fragment="how" class="nav-landing-link">Как работает</a>
      <a routerLink="/" fragment="features" class="nav-landing-link">Возможности</a>
      <a routerLink="/" fragment="privacy" class="nav-landing-link">Приватность</a>
      <a routerLink="/" fragment="faq" class="nav-landing-link">Вопросы</a>
    </nav>
  }

  <div class="nav-right">
    @if (loggedIn) {
      <a
        routerLink="/profile"
        routerLinkActive="active"
        tuiButton
        appearance="flat"
        size="s"
        class="nav-round-btn"
        title="Профиль"
        aria-label="Профиль"
      >
        <tui-icon icon="@tui.circle-user" class="nav-round-icon" />
      </a>
    } @else {
      <a
        routerLink="/auth"
        tuiButton
        appearance="flat"
        size="s"
        class="nav-text-btn"
        title="Войти"
        aria-label="Войти"
      >
        Войти
      </a>
      <a
        routerLink="/auth"
        tuiButton
        appearance="primary"
        size="s"
        class="nav-cta-btn"
        title="Начать бесплатно: через Telegram или MAX, около 30 секунд"
        aria-label="Начать бесплатно"
      >
        Начать
      </a>
    }
  </div>
</nav>
